version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobhunter
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/jobhunter
      NODE_ENV: production
    ports:
      - "4173:4173"
    depends_on:
      - db

volumes:
  postgres_data:
