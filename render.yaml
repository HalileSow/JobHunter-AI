databases:
  - name: jobhunter-ai-db
    plan: free

services:
  - type: web
    name: jobhunter-ai
    env: docker
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    # Plan Starter (512 Mo RAM) — suffisant avec les optimisations mémoire
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: jobhunter-ai-jwt-secret-production-2026-stable
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunter-ai-db
          property: connectionString
      # Limiter la mémoire max du processus Node.js (laisser une marge pour Chromium)
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      # Pool PostgreSQL minimal
      - key: PG_POOL_MIN
        value: "0"
      - key: PG_POOL_MAX
        value: "2"
