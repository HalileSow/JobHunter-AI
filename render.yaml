databases:
  - name: jobhunter-ai-db
    plan: free

services:
  - type: web
    name: jobhunter-ai
    env: docker
    autoDeploy: true
    healthCheckPath: /api/health
    preDeployCommand: npx knex migrate:latest --knexfile knexfile.cjs
    dockerfilePath: ./Dockerfile
    # Plan Starter (512 Mo RAM) — suffisant avec les optimisations mémoire
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4173"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunter-ai-db
          property: connectionString
      # Limiter la mémoire max du processus Node.js (laisser une marge pour Chromium)
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      # Pool PostgreSQL minimal
      - key: PG_POOL_MIN
        value: "0"
      - key: PG_POOL_MAX
        value: "2"
      # Credentials API providers
      - key: FRANCE_TRAVAIL_CLIENT_ID
        value: PAR_jobhunterai_c8a81aaaa0b9bbd1f8a7ebd3baf6cbf0076817d205592a2184f682de705a6ef0
      - key: FRANCE_TRAVAIL_CLIENT_SECRET
        value: 53d30dc3fcbbd0d7dba39d484693785ef56536cda1f2fe6bb93dd71ce566e4e5
