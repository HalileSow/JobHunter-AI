databases:
  - name: jobhunter-ai-db
    plan: free

services:
  - type: web
    name: jobhunter-ai
    env: docker
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunter-ai-db
          property: connectionString
